name: 🚀 Smart-Support Live Ticket Autopilot

on:
  schedule:
    # Der Timer: Läuft vollautomatisch genau einmal pro Stunde
    - cron: '0 * * * *'
  workflow_dispatch:
    # Der manuelle Startknopf

jobs:
  run-predict:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repository auf den Cloud-Server laden
      # Upgrade auf v4.2.0 behebt die Node-Warnung
      uses: actions/checkout@v4.2.0

    - name: 🐍 Python in der Cloud einrichten
      # Upgrade auf v5.2.0 behebt die Node-Warnung
      uses: actions/setup-python@v5.2.0
      with:
        python-version: '3.10'
        # HIER: Das fehlerhafte 'cache: pip' wurde entfernt!

    - name: 🛠️ Benötigte Bibliotheken installieren
      run: |
        python -m pip install --upgrade pip
        pip install pandas sqlalchemy scikit-learn sentence-transformers xgboost joblib requests

    - name: 🤖 Live-Ticket abholen und klassifizieren
      run: python Classification.py

    - name: 💾 Aktualisierte Datenbank auf GitHub sichern
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Autopilot"
        git add Klassifikation.db config.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "⏱️ Inkrementelles Update: Neue Live-Tickets eingepflegt" && git push)
